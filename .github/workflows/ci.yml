name: hermes-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run Hermes legacy contract suite (informational)
        env:
          CI: "1"
        run: |
          set +e
          bash tests/run.sh
          rc=$?
          echo "Legacy suite exit code: $rc (informational; OCI release gate is authoritative)"
          exit 0

  oci-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: OCI release gate
        run: bash tests/oci-release-gate.sh
