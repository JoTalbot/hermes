# Drop-in for hermes-gateway.service — pinned so a regenerated base unit cannot point the
# gateway at another user's interpreter.
#
# MEASURED FAILURE (2026-09-16): `hermes gateway restart --system` rewrote the base unit to
#     ExecStart=/home/ubuntu/hermes-venv/bin/python -m hermes_cli.main gateway run
# The service user (hermes) cannot execute that venv:
#     Failed to execute /home/ubuntu/hermes-venv/bin/python: Permission denied  (203/EXEC)
# restart counter reached 19 and `systemctl is-active` sat at "activating (auto-restart)".
# Drop-ins are not overwritten by that command, so the correct interpreter, home and secret
# file are pinned here. Install: scripts/install.sh copies this file into
# /etc/systemd/system/hermes-gateway.service.d/ and runs daemon-reload.
[Service]
ExecStart=
ExecStart=/home/hermes/.hermes-venv/bin/hermes gateway run
Environment=
Environment=HERMES_HOME=/home/hermes/.hermes
Environment=VIRTUAL_ENV=/home/hermes/.hermes-venv
Environment=PATH=/home/hermes/.hermes-venv/bin:/home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
EnvironmentFile=-/etc/hermes/shim.env
ExecStopPost=
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=false
